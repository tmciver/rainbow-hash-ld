stages:
  - build
  - deploy

variables:
  LOCAL_IMAGE: com.timmciver/caldron

build:
  stage: build
  script:
    - nix-build docker.nix
    - docker load < result
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker tag "$LOCAL_IMAGE:latest" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$LOCAL_IMAGE:latest" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

deploy:
  stage: deploy
  needs: [build]
  script:
    - git -C /opt/propellar/caldron pull --ff-only
    - cd /opt/propellar/caldron
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml pull caldron proxy
    - docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d caldron proxy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
