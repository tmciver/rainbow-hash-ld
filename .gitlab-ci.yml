stages:
  - build
  - deploy

variables:
  LOCAL_IMAGE: com.timmciver/caldron
  INFRA: /opt/propellar/propellar-infra

build:
  stage: build
  tags: [nix]
  script:
    - nix-build docker.nix
    - docker load < result
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker tag "$LOCAL_IMAGE:latest" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$LOCAL_IMAGE:latest" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

deploy:
  stage: deploy
  tags: [deploy]
  needs: [build]
  script:
    - git -C $INFRA pull --ff-only
    - sed -i "s|registry.gitlab.com/tmciver/caldron:.*|registry.gitlab.com/tmciver/caldron:${CI_COMMIT_SHA}|" $INFRA/docker-compose.yml
    - |
      git -C $INFRA diff --quiet docker-compose.yml || \
        git -C $INFRA -c user.email="ci@propellar.app" -c user.name="GitLab CI" \
          commit -m "Deploy caldron ${CI_COMMIT_SHA}" docker-compose.yml
    - git -C $INFRA push
    - mkdir -p $INFRA/static/caldron
    - cp /opt/propellar/caldron/static/* $INFRA/static/caldron/
    - docker compose -f $INFRA/docker-compose.yml pull caldron caldron-proxy
    - docker compose -f $INFRA/docker-compose.yml up -d --force-recreate caldron caldron-proxy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
