services:
  caldron:
    image: com.timmciver/caldron:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      - FILE_STORE_URL=http://rainbow-hash:3000/blobs
      - SPARQL_URL=http://caldron-fuseki:3030/ds
    volumes:
      - ./data/thumbnails:/data/thumbnails
    depends_on:
      - rainbow-hash
      - caldron-fuseki

  caldron-fuseki:
    image: atomgraph/fuseki:4.7.0
    user: root # otherwise the fuseki user does not have permissions to the mounted folder which is owner by root
    restart: unless-stopped
    expose:
      - 3030
    volumes:
      - ./data/fuseki:/fuseki/databases
      - ./conf/fuseki/config.ttl:/fuseki/config.ttl:ro
    entrypoint: ["/bin/sh", "-c", "find /fuseki/databases -name 'tdb.lock' -delete && exec ./entrypoint.sh --config /fuseki/config.ttl"]

  rainbow-hash:
    image: com.timmciver/rainbow-hash:latest
    restart: unless-stopped
    command: ["--storage-dir", "/usr/local/data"]
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./data/rainbow-hash:/usr/local/data

  proxy:
    profiles: [standalone]
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/http/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static
      - ./caldron.timmciver.com.crt:/etc/nginx/ssl/server.crt
      - ./caldron.timmciver.com.key:/etc/nginx/ssl/server.key
    depends_on:
      - caldron
